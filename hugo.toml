baseURL = "https://levikouablan.net/"
locale = "en-US"
title = "Désiré-Lévi's logbook"
theme = "hugo-coder"
defaultContentLanguage = "en"
enableRobotsTXT = true

[pagination]
  pagerSize = 20

[markup]
  [markup.highlight]
    noClasses = false

[params]
  author = "Désiré-Lévi Kouablan"
  info = "Staff Software Engineer / Technical Lead"
  description = "Désiré-Lévi Kouablan, Staff Software Engineer / Technical Lead. Backend systems and platform engineering."
  keywords = "staff engineer,technical lead,backend,platform engineering,java,spring boot,go,kubernetes"
  avatarURL = "img/me.jpg"

  favicon_32 = "favicon-32x32.png"
  favicon_16 = "favicon-16x16.png"
  touchicon = "apple-touch-icon.png"

  # Default social preview (Open Graph / Twitter card). Pages can override with `images` in front matter.
  images = ["images/og-default.png"]

  customCSS = ["css/projects.css"]

  since = 2021
  enableEmoji = true

  colorScheme = "auto"
  hideColorSchemeToggle = false

[taxonomies]
  series = "series"
  tag = "tags"

