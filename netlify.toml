[build]
publish = "public"
command = "hugo --gc --minify"

[build.environment]
HUGO_VERSION = "0.167.0"

# Previews use their own URL and include drafts, so work in progress can be reviewed before merging.
[context.deploy-preview]
command = "hugo --gc --minify --buildDrafts --baseURL $DEPLOY_PRIME_URL"
